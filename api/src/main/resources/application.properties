spring.application.name=be

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/connectspace}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-production}
app.jwt.ttl-hours=${JWT_TTL_HOURS:24}
